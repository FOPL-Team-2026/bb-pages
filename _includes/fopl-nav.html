<nav class="fopl-nav">
  <div class="fopl-nav-left">
    <ul class="fopl-nav-links fopl-nav-links--left">
      <li{% if page.fopl_nav_active == 'home' %} class="active"{% endif %}><a href="{{ '/home' | relative_url }}">Home</a></li>
      <li{% if page.fopl_nav_active == 'bookstore' %} class="active"{% endif %}><a href="{{ '/bookstore' | relative_url }}">Shop</a></li>
    </ul>
  </div>
  <div class="fopl-nav-right">
    <ul class="fopl-nav-links fopl-nav-links--right">
      <li style="position:relative;">
        <button id="fopl-cal-pop-btn" class="fopl-nav-cal-icon" onclick="foplToggleCalPopup()" title="Events Calendar" aria-label="Events Calendar"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></button>
        <div id="fopl-cal-popup" class="fopl-cal-popup">
          <div class="fopl-pop-header">
            <button class="fopl-pop-nav" onclick="foplPopCalPrev()">&#8249;</button>
            <span class="fopl-pop-month" id="fopl-pop-month-label"></span>
            <button class="fopl-pop-nav" onclick="foplPopCalNext()">&#8250;</button>
          </div>
          <div class="fopl-pop-grid" id="fopl-pop-grid"></div>
          <div class="fopl-pop-detail" id="fopl-pop-detail"></div>
        </div>
      </li>
      <li>
        <button id="fopl-dark-toggle" class="fopl-nav-dark-toggle" onclick="foplToggleDark()" title="Toggle dark mode" aria-label="Toggle dark mode">
          <svg class="fopl-dark-icon-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="fopl-dark-icon-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
      </li>
      <li id="nav-auth-item"><a href="{{ '/login' | relative_url }}" id="nav-auth-link">Sign In</a>
        <ul class="fopl-nav-dropdown" id="nav-auth-dropdown">
          <li><a href="{{ '/profile' | relative_url }}">Profile</a></li>
          <li><a href="#" id="nav-signout-btn">Sign Out</a></li>
        </ul>
      </li>
    </ul>
  </div>
</nav>
